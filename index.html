<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>COAC Team Lunch Countdown</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #fff7ed, #ffe4c7);
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 24px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .emoji {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 32px;
            color: #222;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }

        .date {
            font-size: 18px;
            font-weight: bold;
            color: #e85d04;
            margin-bottom: 25px;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .time-box {
            min-width: 90px;
            background: #fff3e6;
            border-radius: 15px;
            padding: 18px 10px;
        }

        .number {
            display: block;
            font-size: 36px;
            font-weight: bold;
            color: #e85d04;
        }

        .label {
            display: block;
            margin-top: 5px;
            font-size: 13px;
            color: #777;
            text-transform: uppercase;
        }

        .message {
            margin-top: 30px;
            font-size: 17px;
            color: #555;
        }

        #finished {
            display: none;
            font-size: 28px;
            font-weight: bold;
            color: #e85d04;
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 27px;
            }

            .time-box {
                min-width: 70px;
            }

            .number {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="emoji">🍽️</div>

        <h1>COAC Team Lunch</h1>

        <p class="subtitle">
            Get ready! Our lunch is almost here.
        </p>

        <div class="date">
            📅 September 27, 2026 &nbsp; | &nbsp; 🕛 12:00 PM
        </div>

        <div class="countdown" id="countdown">

            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">Days</span>
            </div>

            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">Hours</span>
            </div>

            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">Minutes</span>
            </div>

            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">Seconds</span>
            </div>

        </div>

        <div id="finished">
            🎉 It's Lunch Time! 🎉
        </div>

        <p class="message">
            See you there! ❤️
        </p>

    </div>

    <script>
        // September 27, 2026 at 12:00 PM IST
        const targetDate =
            new Date("2026-09-27T12:00:00+05:30").getTime();

        function updateCountdown() {

            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference <= 0) {
                document.getElementById("countdown").style.display = "none";
                document.getElementById("finished").style.display = "block";
                return;
            }

            const days = Math.floor(
                difference / (1000 * 60 * 60 * 24)
            );

            const hours = Math.floor(
                (difference % (1000 * 60 * 60 * 24)) /
                (1000 * 60 * 60)
            );

            const minutes = Math.floor(
                (difference % (1000 * 60 * 60)) /
                (1000 * 60)
            );

            const seconds = Math.floor(
                (difference % (1000 * 60)) /
                1000
            );

            document.getElementById("days").textContent =
                String(days).padStart(2, "0");

            document.getElementById("hours").textContent =
                String(hours).padStart(2, "0");

            document.getElementById("minutes").textContent =
                String(minutes).padStart(2, "0");

            document.getElementById("seconds").textContent =
                String(seconds).padStart(2, "0");
        }

        updateCountdown();

        setInterval(updateCountdown, 1000);
    </script>

</body>
</html>
