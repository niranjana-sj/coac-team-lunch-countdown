<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COAC Team Lunch Countdown</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #f4efdf;
    display: flex;
    justify-content: center;
    font-family: Arial, Helvetica, sans-serif;
  }

  .wrap {
    width: min(691px, 100vw);
    position: relative;
  }

  .poster {
    width: 100%;
    display: block;
  }

  .countdown {
    position: absolute;
    left: 3.3%;
    right: 3.3%;
    top: 44.65%;
    height: 20.25%;
    color: white;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    align-items: center;
    text-align: center;
  }

  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .num {
    font-size: clamp(48px, 11vw, 78px);
    line-height: .9;
    font-weight: 800;
    letter-spacing: -2px;
  }

  .label {
    font-size: clamp(11px, 2.5vw, 16px);
    letter-spacing: 2px;
    color: #dfe9e4;
  }

  .seconds {
    grid-column: 2;
    grid-row: 1;
  }

  .hours {
    grid-column: 1;
    grid-row: 1;
  }

  .minutes {
    grid-column: 3;
    grid-row: 1;
  }

  @media(max-width:480px) {
    .num {
      font-size: 54px;
    }
  }
</style>
</head>

<body>

<div class="wrap">

  <!-- Your original poster image is embedded here -->
  <img
    class="poster"
    src="YOUR_BASE64_IMAGE_HERE"
    alt="COAC Team Lunch invitation"
  >

  <div class="countdown" id="countdown">

    <div class="unit hours">
      <div class="num" id="hours">--</div>
      <div class="label">HOURS</div>
    </div>

    <div class="unit minutes">
      <div class="num" id="minutes">--</div>
      <div class="label">MINUTES</div>
    </div>

    <div class="unit seconds">
      <div class="num" id="seconds">--</div>
      <div class="label">SECONDS</div>
    </div>

  </div>
</div>

<script>

const target = new Date("2026-09-27T12:00:00+05:30").getTime();

function updateCountdown() {

  const now = Date.now();
  let diff = target - now;

  if (diff <= 0) {

    document.getElementById("hours").textContent = "00";
    document.getElementById("minutes").textContent = "00";
    document.getElementById("seconds").textContent = "00";

    return;
  }

  const totalSeconds = Math.floor(diff / 1000);

  const h = Math.floor(totalSeconds / 3600);

  const m = Math.floor(
    (totalSeconds % 3600) / 60
  );

  const s = totalSeconds % 60;

  document.getElementById("hours").textContent =
    String(h).padStart(2, "0");

  document.getElementById("minutes").textContent =
    String(m).padStart(2, "0");

  document.getElementById("seconds").textContent =
    String(s).padStart(2, "0");
}

updateCountdown();

setInterval(updateCountdown, 1000);

</script>

</body>
</html>
